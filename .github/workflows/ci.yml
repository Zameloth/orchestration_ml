name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff check)
        run: uv run ruff check src/

      - name: Format (ruff format --check)
        run: uv run ruff format --check src/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Tests (pytest)
        run: uv run pytest

  train:
    name: Continuous Training
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Prepare sample data
        run: |
          mkdir -p data/processed
          cp tests/fixtures/processed/*.csv data/processed/

      - name: Train model
        run: uv run python -m lending.train

  # Vérifie seulement que les images se construisent : le déploiement est fait
  # par le timer de Zameloth/self-host, qui les reconstruit sur aspire.
  build:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend, train, data, airflow]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
